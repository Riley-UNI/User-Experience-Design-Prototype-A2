<!-- Helps the browser understand what document type to expect -->
<!DOCTYPE html>
<!-- Sets the language as english and makes the browser treat the page as if its in light mode -->
<html lang="en" data-bs-theme="light">
<head>
    <!-- Attribute that specifies how characters should be enceded for this HTML -->
    <meta charset="UTF-8">
    <!-- Viewport sets the visible area of the page for the user, width=device-width makes the page go to the end width of the page -->
     <!-- Initial-scale sets how zoomed in the page should be when it is loaded -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the title of the webpage viewable from the tab for CSS -->
    <title>Manifold Heights Baptist Church</title>
    <!-- This is the bootstrap plugin being installed by CDN for JavaScript -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- This is the bootstrap plugin being installed by CDN -->
    <script defer type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <!-- The following three lines link the font pages for the Roboto font for the page to render -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- The next two lines link the local CSS and JavaScript files created by me -->
    <link rel="stylesheet" href="contactstyle.css">
    <script type="text/javascript" src="darkmode.js" defer></script>
    
</head>

 <header>

  <!-- Start of navbar, sets the size of the navbar, colours text and sets the theme to dark as if the browser was set to dark mode -->
<nav class="navbar sm:navbar-expand bg-1 fg-2" data-bs-theme="dark">
    <!-- Creates a fluid bootstrap container to help in scaling elements for different screen sizes -->
  <div class="container-fluid">
    <!-- Next three lines create a button on the Navbar for the Icon, and links back to the home page -->
    <a class="navbar-brand" href="index.html">
      <img src="Mano_Chapel_Logo.png" alt="Mano Chapel" width="60" height="48">
    </a>
    <!-- Next eight lines creates a hamburger menu for when screens are too small to contain all Navbar buttons sourced from https://getbootstrap.com/docs/6.0/components/navbar/ -->
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup" aria-labelledby="navbarNavAltMarkupLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <!-- Next six lines set the rest of the buttons for the Navbar buttons and their links -->
      <div class="drawer-body">
        <div class="nav nav-pills navbar-nav" id="navbar-buttons">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="#">About</a>
          <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
          <a class="nav-link" href="#">Donate</a>
        </div>
      </div>
    </dialog>
  </div>
</nav>
<!-- Sets a container as fluid for better screen scaling with an ID tag used later in CSS -->
<div class="container-fluid" id="main-container">
    <!-- Sets the form to send what following inputs the form gets inputed and fowards it to my email
     Should be noted that my email is a placeholder, when marking this, please fill out the form and submit the form with
    the plug in Live Server by Ritwick Dey otherwise the email will not work. Ask me to send a screen shot back to you of the email so you can confirm it works please -->
        <form action="https://formsubmit.co/riley.everett@student.torrens.edu.au" method="POST">
            <!-- Creats a heading three with text prompting the user to email the Church -->
            <h3>Get in touch!</h3>
            <!-- The following sets a type of input they are and their ID with a name, then sets a place holder so the user knows which
             which input is used for which section of an email -->
             <!-- Important to note that Claude AI was used as this wasn't working however its contribution was very minor as all I had
              wrong was setting the name= varible was absent -->
            <input type="text" id="name" name="name" placeholder="Your name" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="text" id="subject" name="_subject" placeholder="Subject" required>
            <!-- Similar to input however textarea allows for more space for the user to write their email -->
            <textarea id="message" name="message" rows="4" placeholder="How can we help you?"></textarea>
            <!-- Attaches a button with the type submit and id submitbutton to finilise and send the inputs in the form into an email -->
            <button type="submit" id="submitbutton">Send</button>
        </form>   
        </div>
</body>
</html>
